name: docs-checks

on:
  push:
    branches: [Main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Docs consistency gate
        run: bash scripts/check-docs-consistency.sh
