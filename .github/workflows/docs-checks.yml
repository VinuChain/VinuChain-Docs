name: docs-checks

on:
  push:
    branches: [Main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Docs consistency gate
        run: bash scripts/check-docs-consistency.sh
